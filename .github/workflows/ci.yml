name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (typecheck, lint, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:domain
      - run: npm run test --workspace @faultspan/web

  contract:
    name: Contract (genvm-lint, direct tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install contract tooling
        run: |
          python -m pip install --upgrade pip
          pip install genvm-linter genlayer-test
      - name: Lint contract
        run: genvm-lint check contracts/faultspan.py --json
      - name: Run direct tests
        run: pytest tests/direct/ -v

  schema:
    name: Frontend/contract schema alignment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify:schema
        env:
          FAULTSPAN_CONTRACT_ADDRESS: "0x161275d7E8b18C58E0C88518c74BD036c96F998C"

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: Frontend Playwright e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          NEXT_PUBLIC_GENLAYER_RPC_URL: "https://studio.genlayer.com/api"
          NEXT_PUBLIC_GENLAYER_CHAIN_ID: "61999"
          NEXT_PUBLIC_FAULTSPAN_CONTRACT_ADDRESS: "0x161275d7E8b18C58E0C88518c74BD036c96F998C"
          NEXT_PUBLIC_PLATFORM_API_URL: "https://faultspan-worker.ayoolarachi.workers.dev"
